name: Deploy portfolio after review
# Main-only; never deploy an unreviewed feature branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: /
          VITE_CONTACT_MODE: email
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --email
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          # HTTPS is enforced, so http:// answers 301; verify the live HTTPS page
          # and that plain HTTP redirects to it.
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$PAGE_URL" -o /tmp/atajan-page.html
          grep -q 'Atajan' /tmp/atajan-page.html
          location=$(curl --silent --show-error --retry 3 --retry-delay 5 -o /dev/null -w '%{redirect_url}' http://atajan.org/)
          if [ "$location" != "https://atajan.org/" ]; then
            echo "::warning::http://atajan.org/ does not redirect to HTTPS (got '$location'). Check 'Enforce HTTPS' in Settings > Pages."
          fi
