name: Deploy portfolio after review
# Main-only; never deploy an unreviewed feature branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: /
          VITE_CONTACT_MODE: email
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --email
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          # Verify the published Pages artifact even before owner DNS is ready.
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --resolve atajan.org:80:185.199.108.153 http://atajan.org/ -o /tmp/atajan-page.html
          grep -q 'Atajan' /tmp/atajan-page.html
          if getent ahostsv4 atajan.org | awk '{print $1}' | grep -Eq '^185\.199\.(108|109|110|111)\.153$'; then
            if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 "$PAGE_URL" > /dev/null; then
              echo '::warning::The Pages artifact is published, but custom-domain HTTPS is not ready. Check certificate issuance in Settings > Pages.'
            fi
          else
            echo '::warning::The Pages artifact is published. Owner DNS setup for atajan.org is still pending.'
          fi
